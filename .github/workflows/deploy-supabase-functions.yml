name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
    steps:
      - name: Resolve the Supabase project
        id: project
        run: |
          ref="$SUPABASE_PROJECT_REF"
          if [ -z "$ref" ] && [ -n "$VITE_SUPABASE_URL" ]; then
            # https://<project-ref>.supabase.co
            ref=$(printf '%s' "$VITE_SUPABASE_URL" | sed -nE 's#^https?://([a-z0-9]+)\.supabase\.co/?.*$#\1#p')
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ref" ]; then
            echo "::notice::Skipping deploy: add the SUPABASE_ACCESS_TOKEN secret (and VITE_SUPABASE_URL or SUPABASE_PROJECT_REF)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.project.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.project.outputs.ready == 'true'
        with:
          version: latest
      - name: Deploy market-quotes
        if: steps.project.outputs.ready == 'true'
        run: supabase functions deploy market-quotes --project-ref "${{ steps.project.outputs.ref }}" --use-api
