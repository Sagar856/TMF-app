name: Deploy Web App to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site from the exact signed APK build
        uses: actions/download-artifact@v4
        with:
          name: MINARTH-signed-site
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify update artifact exists
        run: test -s dist/downloads/TMF-app.apk && test -s dist/downloads/update.json
      - name: Prevent an older queued workflow from rolling back updates
        id: current
        run: |
          STATUS=$(curl --silent --show-error --connect-timeout 15 --max-time 30 -o current-update.json -w '%{http_code}' "https://sagar856.github.io/TMF-app/downloads/update.json?t=$GITHUB_RUN_ID")
          NEW_CODE=$(jq -er '.versionCode' dist/downloads/update.json)
          if [ "$STATUS" = "200" ]; then
            OLD_CODE=$(jq -er '.versionCode' current-update.json)
            if [ "$NEW_CODE" -le "$OLD_CODE" ]; then
              echo "Skipping stale or already deployed build $NEW_CODE"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$STATUS" != "404" ]; then
            echo "Could not determine deployed version (HTTP $STATUS)"; exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.current.outputs.deploy == 'true'
        with:
          path: dist
      - name: Deploy matching website, APK and metadata
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
