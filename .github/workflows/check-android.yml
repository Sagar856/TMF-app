name: Check Android build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distribution: [play, sideload]
    env:
      ANDROID_DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-36" "build-tools;36.0.0"; then exit 0; fi
            echo "::warning::Android SDK download failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx cap add android && npx cap sync android && npm run android:patch
      - name: Download Gradle with bounded retries
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then exit 0; fi
            echo "::warning::Gradle bootstrap failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
      - name: Validate Android lint and debug compilation without signing secrets
        working-directory: android
        run: ./gradlew lintDebug assembleDebug --no-daemon --stacktrace --console=plain
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MINARTH-android-lint-${{ matrix.distribution }}
          path: |
            android/**/build/reports/lint-results-*
            node_modules/@capacitor/android/capacitor/build/reports/lint-results-*
          if-no-files-found: ignore
