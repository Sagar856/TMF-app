name: Update market data

on:
  schedule:
    # 19:00 IST on trading days: after the NSE close, the bhavcopy publication and the IBJA PM rate.
    - cron: '30 13 * * 1-5'
    # 08:00 IST next morning: picks up US closes and retries anything missed.
    - cron: '30 2 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load the previously published files
        run: |
          mkdir -p out previous
          if git fetch --depth=1 origin market-data 2>/dev/null; then
            for file in market-data.json stocks.json; do
              git show "FETCH_HEAD:$file" > "previous/$file" 2>/dev/null || rm -f "previous/$file"
            done
          fi
      - name: Build market data (NSE/BSE bhavcopy, Nasdaq, ECB FX, IBJA gold/silver)
        run: node --import tsx scripts/fetch-market-data.mjs --out-dir out --previous-dir previous
      - name: Publish to the market-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Files this run could not build keep their last published version.
          mkdir publish
          for file in market-data.json stocks.json; do
            if [ -f "out/$file" ]; then cp "out/$file" publish/; elif [ -f "previous/$file" ]; then cp "previous/$file" publish/; fi
          done
          if [ -z "$(ls -A publish)" ]; then
            echo "Nothing fetched; nothing to publish."
            exit 0
          fi
          if diff -rq publish previous >/dev/null 2>&1; then
            echo "Market data unchanged; nothing to publish."
            exit 0
          fi
          # A single force-pushed orphan commit keeps the data branch small; it never touches main.
          cd publish
          git init -q -b market-data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Market data $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" market-data; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
