name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: signed-apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_DISTRIBUTION: sideload
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: https://sagar856.github.io/TMF-app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assign increasing Android version code
        env:
          VERSION_BASE: ${{ vars.ANDROID_APK_VERSION_BASE || '100000' }}
        run: |
          [[ "$VERSION_BASE" =~ ^[0-9]+$ ]] || { echo "Invalid ANDROID_APK_VERSION_BASE"; exit 1; }
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          CODE=$((VERSION_BASE + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$CODE" -gt 0 && test "$CODE" -le 2100000000
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Restore persistent APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Configure all four APK_SIGNING secrets before publishing. No debug-key fallback is allowed."; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minarth-apk.jks"
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx cap add android && npx cap sync android && npm run android:patch
      - name: Build signed release APK
        working-directory: android
        env:
          TMF_RELEASE_STORE_FILE: ${{ runner.temp }}/minarth-apk.jks
          TMF_RELEASE_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          TMF_RELEASE_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          TMF_RELEASE_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew lintRelease assembleRelease --no-daemon
      - name: Verify signed APK identity and version
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.trackmoneyflow.app' versionCode='$ANDROID_VERSION_CODE'"
      - name: Build matching Pages site and publish update metadata
        run: |
          GITHUB_PAGES=true npm run build
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/TMF-app.apk
          node scripts/apk-update-metadata.mjs dist/downloads/TMF-app.apk dist/downloads/update.json
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MINARTH-signed-apk
          path: |
            dist/downloads/TMF-app.apk
            dist/downloads/update.json
          if-no-files-found: error
      - name: Upload matching site for Pages deployment
        uses: actions/upload-artifact@v4
        with:
          name: MINARTH-signed-site
          path: dist
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.ANDROID_VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          name: MINARTH Android build ${{ env.ANDROID_VERSION_CODE }}
          body: |
            Signed sideload update. Install over an existing installation signed with the same key; do not uninstall.
            Android versionCode: ${{ env.ANDROID_VERSION_CODE }}
            The Pages deployment publishes the APK and update.json used by the in-app updater.
          files: |
            dist/downloads/TMF-app.apk
            dist/downloads/update.json
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/minarth-apk.jks"
