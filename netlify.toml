[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/stock-quote"
  to = "/.netlify/functions/stock-quote"
  status = 200

# SPA fallback: all client-side routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
